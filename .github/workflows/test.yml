name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Lua 5.1, luacov and the LCOV reporter
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.1 liblua5.1-dev luarocks
        luarocks install --lua-version=5.1 luacov
        luarocks install --lua-version=5.1 luacov-reporter-lcov
        luarocks install --lua-version=5.1 luaunit
    - name: Run unit tests with coverage
      run: |
        eval $(luarocks --lua-version=5.1 path)
        lua5.1 -lluacov test/oversample_core_test.lua
        luacov -r lcov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: luacov.report.out
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
