name: PR Fixer Squash

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: fixer-squash-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  squash:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == (vars.PR_FIX_AUTHOR || 'asbjornu')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_AW_PUSH_TOKEN }}
          fetch-depth: 0

      - name: Autosquash fixer-authored fixup! commits and force-push
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          # Anchor the rewrite to a maintainer-authored dispatch marker whose
          # recorded head is an ancestor of the current head, so only commits
          # pushed after an actual fixer dispatch are eligible.
          marker_head=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select((.author_association == "OWNER" or .author_association == "MEMBER") and (.body | startswith("<!-- aw-pr-fix-state"))) | "\(.created_at)\t\(.body)"' \
            | sort | tail -n 1 | sed -n 's/.*head=\([0-9a-f]*\).*/\1/p')
          if [ -z "$marker_head" ] || ! git merge-base --is-ancestor "$marker_head" HEAD; then
            echo "No active fixer dispatch for this head; nothing to squash"
            exit 0
          fi
          # Use GitHub's author association for the fixup! commits rather than
          # the local committer name, so a spoofed local author cannot be
          # rewritten. Only fold when every fixup! commit is the fixer's; a
          # branch that mixes in another author's fixup! is left untouched.
          authors=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" \
            --jq '.[] | select(.commit.message | startswith("fixup!")) | (.author.login // "unknown")')
          if [ -z "$authors" ]; then
            echo "No fixup! commits; nothing to squash"
            exit 0
          fi
          if printf '%s\n' "$authors" | grep -qv '^github-actions\[bot\]$'; then
            echo "Non-fixer fixup! commits present; leaving the branch alone"
            exit 0
          fi
          GIT_SEQUENCE_EDITOR=: GIT_EDITOR=: git rebase -i --autosquash --rebase-merges "$base"
          git push --force-with-lease origin "HEAD:$HEAD_REF"
          echo "Squashed and force-pushed $HEAD_REF"
