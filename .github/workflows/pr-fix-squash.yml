name: PR Fixer Squash

# Folds the fixer's fixup! commits on a PR branch and force-pushes, then records
# a squash anchor. Logic lives in scripts/pr_fix_squash.rb and its sequence
# editor in scripts/seq_editor.rb (unit-tested with minitest).

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: fixer-squash-${{ github.event.pull_request.number }}
  # Queue instead of cancel: a run cancelled between writing the anchor and the
  # force-push would strand the anchor at an unpublished SHA, and later runs for
  # the same review would then fall back to the dispatch head.
  # --force-with-lease still stops a stale queued run from clobbering a newer
  # push.
  cancel-in-progress: false

jobs:
  squash:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == (vars.PR_FIX_AUTHOR || 'asbjornu')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: ignore[artipacked] the fixer pushes the squashed branch, so the
        # checkout credential must persist.
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_AW_PUSH_TOKEN }}
          fetch-depth: 0

      # The squash runs with the push credential and GH_AW_PUSH_TOKEN, so its
      # implementation must not come from the pull request: a fixer change to
      # scripts/ would become arbitrary code execution with a repository-writing
      # PAT. Keep the PR checkout as the Git working tree, but run only the base
      # branch's copy; until it exists there, fail closed rather than execute
      # the pull request copy.
      - name: Check out the trusted CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .trusted
          persist-credentials: false

      - name: Autosquash fixer-authored fixup! commits and force-push
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          script=".trusted/scripts/pr_fix_squash.rb"
          if [ ! -f "$script" ]; then
            echo "Trusted CI scripts are not on the base branch yet; refusing to run the pull request copy" >&2
            exit 1
          fi
          ruby "$script"
