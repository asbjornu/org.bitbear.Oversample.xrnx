name: PR Fixer Squash

# Folds the fixer's fixup! commits on a PR branch and force-pushes, then records
# a squash anchor. Logic lives in scripts/pr-fix-squash.sh and its sequence
# editor in scripts/seq-editor.sh (tested with Bats).

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: fixer-squash-${{ github.event.pull_request.number }}
  # Queue instead of cancel: the script force-pushes and verifies the remote
  # before it writes the anchor, so a run cancelled in between would leave the
  # published head unrecorded and later runs for the same review would then fall
  # back to the dispatch head.
  # --force-with-lease still stops a stale queued run from clobbering a newer
  # push.
  cancel-in-progress: false

jobs:
  squash:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == (vars.PR_FIX_AUTHOR || 'asbjornu')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: ignore[artipacked] the fixer pushes the squashed branch, so the
        # checkout credential must persist.
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_AW_PUSH_TOKEN }}
          fetch-depth: 0

      - name: Autosquash fixup! commits and force-push
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/pr-fix-squash.sh
