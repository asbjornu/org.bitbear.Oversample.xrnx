name: PR Fixer Squash

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: fixer-squash-${{ github.event.pull_request.number }}
  # Queue instead of cancel: a run cancelled between writing the anchor and the
  # force-push would strand the anchor at an unpublished SHA, and later runs for
  # the same review would then fall back to the dispatch head.
  # --force-with-lease still stops a stale queued run from clobbering a newer
  # push.
  cancel-in-progress: false

jobs:
  squash:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == (vars.PR_FIX_AUTHOR || 'asbjornu')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_AW_PUSH_TOKEN }}
          fetch-depth: 0

      - name: Autosquash fixer-authored fixup! commits and force-push
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          token_user=$(gh api user --jq '.login')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base=$(git merge-base "origin/$BASE_REF" HEAD)

          # The orchestrator owns the dispatch marker; this workflow must never
          # write it, because a concurrent orchestrator PATCH would be clobbered
          # by a read/modify/write. Read it only, for the dispatch head + review.
          marker=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- aw-pr-fix-state")) | "\(.created_at)\t\(.id)\t\(.user.login)\t\(.body)"' \
            | sort | awk -F'\t' -v who="$token_user" '$3 == who { out = $0 } END { if (out != "") print out }')
          marker_head=$(printf '%s' "$marker" | sed -n 's/.*head=\([0-9a-f]*\).*/\1/p')
          marker_review=$(printf '%s' "$marker" | sed -n 's/.*review=\([0-9][0-9]*\).*/\1/p')

          # This workflow owns a separate anchor comment, so it has a single
          # writer (its own runs are serialized by the concurrency group) and can
          # never clobber the orchestrator's dispatch state. It records the head
          # already squashed for the current review round.
          anchor=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- aw-pr-fix-squash-anchor")) | "\(.created_at)\t\(.id)\t\(.user.login)\t\(.body)"' \
            | sort | awk -F'\t' -v who="$token_user" '$3 == who { out = $0 } END { if (out != "") print out }')
          anchor_id=$(printf '%s' "$anchor" | awk -F'\t' '{ print $2 }')
          anchor_review=$(printf '%s' "$anchor" | sed -n 's/.*review=\([0-9][0-9]*\).*/\1/p')
          anchor_head=$(printf '%s' "$anchor" | sed -n 's/.*head=\([0-9a-f]*\).*/\1/p')
          # Start each round from the orchestrator's dispatch head; reuse this
          # workflow's own anchor only within the same round.
          if [ -z "$anchor_head" ] || [ "$anchor_review" != "$marker_review" ]; then
            anchor_head="$marker_head"
          fi
          # Safety net: if the branch was force-pushed by something else, the
          # same-review anchor may no longer be an ancestor. Fall back to the
          # dispatch head so the round can still squash. (The anchor is only ever
          # written after a verified push, so it does not point at an unpublished
          # SHA.)
          if [ -n "$anchor_head" ] && ! git merge-base --is-ancestor "$anchor_head" HEAD; then
            echo "Anchor $anchor_head is not an ancestor; falling back to the dispatch head" >&2
            anchor_head="$marker_head"
          fi
          if [ -z "$anchor_head" ] || ! git merge-base --is-ancestor "$anchor_head" HEAD; then
            echo "No active fixer dispatch for this head; nothing to squash"
            exit 0
          fi

          # Write the squash anchor (create once, then update in place). Only this
          # workflow writes it, so no cross-workflow race is possible.
          write_anchor() {
            local head="$1" body
            body="<!-- aw-pr-fix-squash-anchor review=$marker_review head=$head -->"
            if [ -n "$anchor_id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$anchor_id" -f body="$body" >/dev/null 2>&1
            else
              anchor_id=$(gh api -X POST "repos/$REPO/issues/$PR/comments" \
                -f body="$body" --jq '.id')
            fi
          }

          # Only commits pushed after the dispatch head are eligible: every one
          # must be the fixer's and at least one must be a fixup!, so a
          # contributor push in the window aborts the rewrite.
          head=$(git rev-parse HEAD)
          cmp=$(gh api "repos/$REPO/compare/$anchor_head...$head" 2>/dev/null || echo '{}')
          total=$(printf '%s' "$cmp" | jq -r '.total_commits // 0')
          seen=$(printf '%s' "$cmp" | jq -r '(.commits // []) | length')
          if [ "${total:-0}" -gt "${seen:-0}" ] 2>/dev/null; then
            echo "Compare range truncated; refusing to rewrite"
            exit 0
          fi
          range=$(printf '%s' "$cmp" \
            | jq -r '(.commits // [])[] | "\(.author.login // "unknown")\t\(.commit.message | split("\n")[0])"')
          verdict=$(printf '%s\n' "$range" | awk -F'\t' '
            $1 != "github-actions[bot]" { bad = 1 }
            $2 ~ /^fixup! / { good = 1 }
            { any = 1 }
            END {
              if (bad) print "mixed";
              else if (!any) print "empty";
              else if (!good) print "normal";
              else print "fixups";
            }')
          if [ "$verdict" != "fixups" ]; then
            if [ "$verdict" = "normal" ]; then
              echo "Only fixer normal commits since dispatch; requesting a review"
              gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" \
                -f 'reviewers[]=copilot-pull-request-reviewer[bot]' >/dev/null 2>&1 || true
            else
              echo "Commits since the dispatch head are not purely fixer fixups; nothing to squash"
            fi
            exit 0
          fi

          # Move only the fixer's fixup! commits next to their targets and fold
          # them; every other commit keeps its original position and message.
          cat > /tmp/seq-editor.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          todo="$1"
          mapfile -t raw < "$todo"
          n=${#raw[@]}
          declare -a cmd sha subj
          for ((i=0; i<n; i++)); do
            line="${raw[$i]}"
            cmd[$i]="${line%% *}"
            rest="${line#* }"
            case "$rest" in
              -C\ *|-c\ *) rest="${rest#* }" ;;
            esac
            token="${rest%% *}"
            sha[$i]="$(git rev-parse --verify -q "${token}^{commit}" 2>/dev/null || echo "$token")"
            # Read the subject from the commit object, not the todo line: git >=
            # 2.55 writes todo lines as "pick <sha> # <subject>", and stripping
            # that separator would corrupt a legacy subject that itself begins
            # with "# " (e.g. "# Render").
            subj[$i]="$(git log -1 --format=%s "${sha[$i]}" 2>/dev/null || echo "${rest#* }")"
          done
          declare -A moved move_to
          for ((i=0; i<n; i++)); do
            if [[ "${subj[$i]:-}" == fixup!\ * ]]; then
              author="$(git log -1 --format=%an "${sha[$i]}" 2>/dev/null || true)"
              if [ "$author" = "github-actions[bot]" ]; then
                found=""
                target_sha="$(git log -1 --format=%B "${sha[$i]}" 2>/dev/null \
                  | sed -n 's/^aw-fixup-target=\([0-9a-f]\{7,40\}\)[[:space:]]*$/\1/p' | tail -n 1)"
                if [ -n "$target_sha" ]; then
                  for ((k=0; k<n; k++)); do
                    if [ "${sha[$k]}" = "$target_sha" ] && [ "${cmd[$k]}" = "pick" ]; then
                      found=$k
                      break
                    fi
                  done
                fi
                # Fall back to subject matching when the recorded target SHA is
                # absent or stale (a prior force-push rewrote it). Without this,
                # such a fixup is left unfolded in the todo as a normal commit.
                if [ -z "$found" ]; then
                  target="${subj[$i]#fixup! }"
                  j=$((i-1))
                  while [ $j -ge 0 ]; do
                    if [[ "${cmd[$j]}" == "pick" && "${subj[$j]}" == "$target" ]]; then
                      found=$j
                      break
                    fi
                    j=$((j-1))
                  done
                fi
                if [ -n "$found" ]; then
                  moved[$i]=1
                  move_to[$found]="${move_to[$found]:-} ${sha[$i]}"
                fi
              fi
            fi
          done
          out="$(mktemp)"
          for ((i=0; i<n; i++)); do
            if [ -n "${moved[$i]:-}" ]; then continue; fi
            printf '%s\n' "${raw[$i]}" >> "$out"
            if [ -n "${move_to[$i]:-}" ]; then
              for s in ${move_to[$i]}; do printf 'fixup %s\n' "$s" >> "$out"; done
            fi
          done
          mv "$out" "$todo"
          SCRIPT
          chmod +x /tmp/seq-editor.sh

          if ! GIT_SEQUENCE_EDITOR=/tmp/seq-editor.sh GIT_EDITOR=: git rebase -i --rebase-merges "$base"; then
            git rebase --abort >/dev/null 2>&1 || true
            # Never touch the orchestrator's marker here; request a fresh review
            # so a new round re-anchors and retries.
            echo "Squash failed; requesting a review"
            gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" \
              -f 'reviewers[]=copilot-pull-request-reviewer[bot]' >/dev/null 2>&1 || true
            exit 0
          fi

          # Push first, then record the anchor only once the remote actually has
          # the new tip. Writing the anchor before (or regardless of) the push
          # can strand it at an unpublished SHA. The synchronize run the push
          # triggers is queued (cancel-in-progress: false), so this run finishes
          # — and writes the anchor — before that run starts.
          new_head=$(git rev-parse HEAD)
          git push --force-with-lease origin "HEAD:$HEAD_REF" || true
          remote_head=$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)
          if [ "$remote_head" = "$new_head" ]; then
            echo "Squashed and force-pushed $HEAD_REF"
            if ! write_anchor "$new_head"; then
              echo "Could not record the squash anchor at $new_head" >&2
            fi
          else
            # The push did not land (or the branch moved); leave the anchor at
            # the last published head so a later run can retry.
            echo "Squash push did not land (remote at ${remote_head:0:12}); anchor unchanged" >&2
          fi
