name: PR Fixer Squash

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: fixer-squash-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  squash:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == (vars.PR_FIX_AUTHOR || 'asbjornu')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_AW_PUSH_TOKEN }}
          fetch-depth: 0

      - name: Autosquash fixer-authored fixup! commits and force-push
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          if ! git log "$base"..HEAD --format='%an%x09%s' |
            awk -F'\t' '$2 ~ /^fixup! / && $1 == "github-actions[bot]" { found = 1 } END { exit !found }'; then
            echo "No fixer-authored fixup! commits; nothing to squash"
            exit 0
          fi
          # Fold only the fixer's fixup! commits. Any other author's fixup!
          # commit is kept as a normal pick (message unchanged), so a
          # contributor's own autosquash commits are never rewritten.
          cat > /tmp/seq-editor.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          todo="$1"
          tmp="$(mktemp)"
          while IFS= read -r line; do
            cmd="${line%% *}"
            case "$cmd" in
              fixup|squash)
                rest="${line#* }"
                sha="${rest%% *}"
                author="$(git log -1 --format=%an "$sha" 2>/dev/null || true)"
                if [ "$author" = "github-actions[bot]" ]; then
                  printf '%s\n' "$line" >> "$tmp"
                else
                  printf 'pick %s\n' "$rest" >> "$tmp"
                fi
                ;;
              *)
                printf '%s\n' "$line" >> "$tmp"
                ;;
            esac
          done < "$todo"
          mv "$tmp" "$todo"
          SCRIPT
          chmod +x /tmp/seq-editor.sh
          GIT_SEQUENCE_EDITOR=/tmp/seq-editor.sh GIT_EDITOR=: git rebase -i --autosquash --rebase-merges "$base"
          git push --force-with-lease origin "HEAD:$HEAD_REF"
          echo "Squashed and force-pushed $HEAD_REF"
