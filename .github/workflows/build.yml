name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Lua 5.1 and LuaJIT
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.1 luajit
        sudo ln -sf /usr/bin/luac5.1 /usr/local/bin/luac
        luac -v
        luajit -v
    - name: lua-releng
      run: wget --quiet --output-document - https://github.com/openresty/openresty-devel-utils/raw/master/lua-releng 2>/dev/null | perl
    - name: LuaJIT syntax check
      run: find "$(pwd)" -name '*.lua' -type f -print0 | while IFS= read -r -d '' f; do luajit -bl "$f" > /dev/null || exit 1; done

  compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install LuaJIT
      run: |
        sudo apt-get update
        sudo apt-get install -y luajit
        luajit -v
    - name: luajit
      run: find "$(pwd)" -name '*.lua' -type f -print0 | while IFS= read -r -d '' f; do luajit -bl "$f" > /dev/null || exit 1; done

  luacheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install luacheck
      run: |
        sudo apt-get update
        sudo apt-get install -y lua-check
        luacheck --version
    - name: luacheck
      run: luacheck .

  xml:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install xmllint
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-utils
        xmllint --version
    - name: Validate XML
      run: git ls-files '*.xml' | while IFS= read -r f; do xmllint --noout "$f" || exit 1; done
