name: PR Fixer Orchestrator

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-fix-orchestrator
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the fixer for new Copilot reviews
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ vars.PR_FIX_AUTHOR || 'asbjornu' }}
          MAX_ROUNDS: ${{ vars.PR_FIX_MAX_ROUNDS || '6' }}
        run: |
          set -euo pipefail
          wf_id=$(gh api "repos/$REPO/actions/workflows" \
            --jq '.workflows[] | select(.path == ".github/workflows/pr-fix.lock.yml") | .id')
          if [ -z "$wf_id" ]; then
            echo "pr-fix workflow not on the default branch yet; nothing to do"
            exit 0
          fi

          inprogress=$(gh api "repos/$REPO/actions/workflows/$wf_id/runs?status=in_progress&per_page=1" --jq '.total_count')
          queued=$(gh api "repos/$REPO/actions/workflows/$wf_id/runs?status=queued&per_page=1" --jq '.total_count')
          if [ "${inprogress:-0}" != "0" ] || [ "${queued:-0}" != "0" ]; then
            echo "A PR Fixer run is already pending; skipping this cycle"
            exit 0
          fi

          # workflow_dispatch runs are not bot-gated, but if one is ever parked
          # re-run it as this PAT owner. Only runs whose head_branch is the
          # default branch are dispatch runs; legacy event-triggered runs are
          # ignored so they are not replayed.
          default_branch=$(gh api "repos/$REPO" --jq '.default_branch')
          parked=$(gh api --paginate "repos/$REPO/actions/workflows/$wf_id/runs?status=action_required&per_page=100" \
            --jq '.workflow_runs[] | "\(.created_at)\t\(.head_branch)\t\(.id)"' \
            | sort | awk -F'\t' -v b="$default_branch" '$2 == b { id = $3 } END { print id }')
          if [ -n "$parked" ]; then
            echo "Re-running parked fixer run $parked"
            gh api -X POST "repos/$REPO/actions/runs/$parked/rerun" >/dev/null || echo "Re-run failed for $parked"
            exit 0
          fi

          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.draft == false and (.head.repo.full_name == .base.repo.full_name)) | "\(.user.login)\t\(.number)"' |
          while read -r author pr; do
            if [ -z "$pr" ] || [ "$author" != "$AUTHOR" ]; then
              continue
            fi
            head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
            review=$(gh api --paginate "repos/$REPO/pulls/$pr/reviews?per_page=100" \
              --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]" or .user.login == "Copilot" or .user.login == "copilot") | "\(.submitted_at)\t\(.commit_id)\t\(.id)"' |
              awk -F'\t' -v h="$head" '$2 == h { id = $3 } END { print id }')
            if [ -z "$review" ]; then
              echo "PR #$pr: no Copilot review on the current head"
              continue
            fi

            # Only trust a marker written by a maintainer, so an untrusted
            # commenter cannot forge state and suppress the fixer.
            prev=$(gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" \
              --jq '.[] | select((.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") and (.body | startswith("<!-- aw-pr-fix-state"))) | "\(.created_at)\t\(.id)\t\(.body)"' |
              sort | tail -n 1 || true)
            prev_review=$(printf '%s' "$prev" | sed -n 's/.*review=\([0-9][0-9]*\).*/\1/p')
            prev_round=$(printf '%s' "$prev" | sed -n 's/.*round=\([0-9][0-9]*\).*/\1/p')
            prev_comment=$(printf '%s' "$prev" | awk -F'\t' '{ print $2 }')

            if [ "$prev_review" = "$review" ]; then
              echo "PR #$pr: review $review already dispatched"
              continue
            fi
            round=$(( ${prev_round:-0} + 1 ))
            if [ "$round" -gt "$MAX_ROUNDS" ]; then
              echo "PR #$pr: reached $MAX_ROUNDS rounds; leaving the rest to a human"
              continue
            fi

            before=$(gh api "repos/$REPO/actions/workflows/$wf_id/runs?per_page=1" --jq '.workflow_runs[0].id // 0')
            echo "PR #$pr: dispatching fixer for review $review (round $round)"
            aw_context=$(printf '{"item_type":"pull_request","item_number":%d}' "$pr")
            if ! gh workflow run pr-fix.lock.yml --repo "$REPO" -f "aw_context=$aw_context"; then
              echo "Dispatch failed for PR #$pr; will retry next cycle"
              continue
            fi

            # Record the marker only once the dispatched run actually appears,
            # so a dispatch that never starts is retried next cycle.
            run_id=""
            for _ in 1 2 3 4 5 6; do
              sleep 5
              now=$(gh api "repos/$REPO/actions/workflows/$wf_id/runs?per_page=1" --jq '.workflow_runs[0].id // 0')
              if [ "$now" != "$before" ]; then
                run_id=$now
                break
              fi
            done
            if [ -z "$run_id" ]; then
              echo "PR #$pr: dispatched run not observed yet; not marking (will retry)"
              continue
            fi

            body="<!-- aw-pr-fix-state review=$review pr=$pr round=$round run=$run_id -->"
            if [ -n "$prev_comment" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$prev_comment" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" >/dev/null
            fi

            # One dispatch per cycle keeps run-to-PR association unambiguous.
            break
          done
