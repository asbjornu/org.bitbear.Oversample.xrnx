name: PR Fixer Orchestrator

# Dispatches the gh-aw PR Fixer for new Copilot reviews, one PR per cycle, and
# surfaces terminal fixer failures as PR comments. The state machine lives in
# scripts/pr-fix-orchestrator.sh (tested with Bats).

on:
  schedule:
    # Every 5 minutes: GitHub Actions' minimum practical schedule granularity.
    # The schedule is best-effort and can be delayed under load, so finer
    # intervals would not reliably run more often.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-fix-orchestrator
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository (for gh-aw resolution)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure the gh-aw extension
        run: gh extension install github/gh-aw >/dev/null 2>&1 || true

      # GH_TOKEN is the maintainer PAT (GH_AW_PUSH_TOKEN) for reads and marker
      # comments, so the marker author matches `gh api user`. The workflow
      # dispatch in the script deliberately overrides GH_TOKEN with the job's
      # GITHUB_TOKEN (passed in as GH_AW_DISPATCH_TOKEN), because a fine-grained
      # PAT without Actions: write makes workflow_dispatch fail with HTTP 403.
      - name: Dispatch the fixer for new Copilot reviews
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          GH_AW_DISPATCH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          AUTHOR: ${{ vars.PR_FIX_AUTHOR || 'asbjornu' }}
          MAX_ROUNDS: ${{ vars.PR_FIX_MAX_ROUNDS || '6' }}
        run: bash scripts/pr-fix-orchestrator.sh
