name: Request Copilot review

# Logic lives in scripts/copilot-review-request.sh (tested with Bats).

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-copilot-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login == (vars.PR_FIX_AUTHOR || 'asbjornu'))
    runs-on: ubuntu-latest
    steps:
      # Run the script from a trusted ref, never the PR worktree: it executes
      # with the maintainer PAT, so a same-repo contributor must not be able to
      # change the code that receives the token.
      - name: Check out the trusted base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Request a Copilot review for the current head
        # The script ships with this change and is absent from the base commit
        # until it lands; skip during that rollout window so the job neither
        # fails with "No such file or directory" nor runs PR code with the PAT.
        if: ${{ hashFiles('scripts/copilot-review-request.sh') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          AUTHOR: ${{ vars.PR_FIX_AUTHOR || 'asbjornu' }}
        run: bash scripts/copilot-review-request.sh
