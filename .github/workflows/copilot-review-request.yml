name: Request Copilot review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-copilot-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login == (vars.PR_FIX_AUTHOR || 'asbjornu'))
    runs-on: ubuntu-latest
    steps:
      - name: Request a Copilot review for the current head
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          AUTHOR: ${{ vars.PR_FIX_AUTHOR || 'asbjornu' }}
        run: |
          set -euo pipefail
          token_user=$(gh api user --jq '.login')
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '.state')
          draft=$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')
          author=$(gh api "repos/$REPO/pulls/$PR" --jq '.user.login')
          if [ "$state" != "open" ]; then
            echo "PR #$PR is $state; skipping"
            exit 0
          fi
          if [ "$draft" = "true" ]; then
            echo "PR #$PR is a draft; skipping"
            exit 0
          fi
          if [ "$author" != "$AUTHOR" ]; then
            echo "PR #$PR author is $author, not $AUTHOR; skipping"
            exit 0
          fi
          head_repo=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$REPO" ]; then
            echo "PR #$PR is from a fork ($head_repo); skipping"
            exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          is_all_bot() { awk '$0 != "github-actions[bot]" { bad = 1 } END { exit (bad ? 1 : 0) }'; }
          fixup_authors=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" \
            --jq '.[] | select(.commit.message | startswith("fixup!")) | (.author.login // "unknown")')
          if [ -n "$fixup_authors" ] && printf '%s\n' "$fixup_authors" | is_all_bot; then
            marker_head=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("<!-- aw-pr-fix-state")) | "\(.created_at)\t\(.user.login)\t\(.body)"' \
              | sort | awk -F'\t' -v who="$token_user" '$2 == who { out = $0 } END { if (out != "") print out }' \
              | sed -n 's/.*head=\([0-9a-f]*\).*/\1/p')
            status="diverged"
            range_authors=""
            truncated="no"
            if [ -n "$marker_head" ]; then
              cmp=$(gh api "repos/$REPO/compare/$marker_head...$head" 2>/dev/null || echo '{}')
              status=$(printf '%s' "$cmp" | jq -r '.status // "diverged"')
              total=$(printf '%s' "$cmp" | jq -r '.total_commits // 0')
              seen=$(printf '%s' "$cmp" | jq -r '(.commits // []) | length')
              range_authors=$(printf '%s' "$cmp" | jq -r '(.commits // [])[] | (.author.login // "unknown")')
              if [ "${total:-0}" -gt "${seen:-0}" ] 2>/dev/null; then truncated="yes"; fi
            fi
            if [ "$truncated" = "no" ] \
              && { [ "$status" = "ahead" ] || [ "$status" = "identical" ]; } \
              && [ -n "$range_authors" ] \
              && printf '%s\n' "$range_authors" | is_all_bot; then
              echo "Head has only fixer commits under an active dispatch; the squash workflow will re-request"
              exit 0
            fi
            echo "Fixer fixup! commits present but no purely-fixer active dispatch; requesting a review"
          fi
          reviewed=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" \
            --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]" or .user.login == "copilot-pull-request-reviewer" or .user.login == "Copilot" or .user.login == "copilot") | .commit_id' \
            | grep -c "^${head}$" || true)
          if [ "$reviewed" != "0" ]; then
            echo "Head $head already has a Copilot review; skipping"
            exit 0
          fi
          gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' >/dev/null
          echo "Requested a Copilot review for PR #$PR at $head"
