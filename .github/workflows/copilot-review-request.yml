name: Request Copilot review

# Logic lives in scripts/copilot_review_request.rb (unit-tested with minitest).

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-copilot-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login == (vars.PR_FIX_AUTHOR || 'asbjornu'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The request runs with GH_AW_PUSH_TOKEN, so the code must not come from
      # the pull request: a same-repository PR can edit scripts/ and run
      # arbitrary code with the PAT. Prefer the base branch's copy. It is
      # absent until these scripts are merged, so fall back to the PR copy for
      # that bootstrap only.
      - name: Check out the trusted CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          path: .trusted
          persist-credentials: false

      - name: Request a Copilot review for the current head
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          AUTHOR: ${{ vars.PR_FIX_AUTHOR || 'asbjornu' }}
        run: |
          script=scripts/copilot_review_request.rb
          if [ -f ".trusted/$script" ]; then
            script=".trusted/$script"
          else
            echo "Trusted CI scripts are not on the base branch yet; using the pull request copy" >&2
          fi
          ruby "$script"
