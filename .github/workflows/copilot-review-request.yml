name: Request Copilot review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-copilot-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login == (vars.PR_FIX_AUTHOR || 'asbjornu'))
    runs-on: ubuntu-latest
    steps:
      - name: Request a Copilot review for the current head
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          AUTHOR: ${{ vars.PR_FIX_AUTHOR || 'asbjornu' }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '.state')
          draft=$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')
          author=$(gh api "repos/$REPO/pulls/$PR" --jq '.user.login')
          if [ "$state" != "open" ]; then
            echo "PR #$PR is $state; skipping"
            exit 0
          fi
          if [ "$draft" = "true" ]; then
            echo "PR #$PR is a draft; skipping"
            exit 0
          fi
          if [ "$author" != "$AUTHOR" ]; then
            echo "PR #$PR author is $author, not $AUTHOR; skipping"
            exit 0
          fi
          head_repo=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$REPO" ]; then
            echo "PR #$PR is from a fork ($head_repo); skipping"
            exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          fixup_authors=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" \
            --jq '.[] | select(.commit.message | startswith("fixup!")) | (.author.login // "unknown")')
          if [ -n "$fixup_authors" ] && ! printf '%s\n' "$fixup_authors" | grep -qv '^github-actions\[bot\]$'; then
            echo "Head has only fixer fixup! commits; the squash workflow will re-request"
            exit 0
          fi
          reviewed=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" \
            --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]" or .user.login == "copilot-pull-request-reviewer" or .user.login == "Copilot" or .user.login == "copilot") | .commit_id' \
            | grep -c "^${head}$" || true)
          if [ "$reviewed" != "0" ]; then
            echo "Head $head already has a Copilot review; skipping"
            exit 0
          fi
          gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' >/dev/null
          echo "Requested a Copilot review for PR #$PR at $head"
