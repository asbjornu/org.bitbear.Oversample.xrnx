name: Tests

# Tests for the CI scripts under scripts/ (bats + shellcheck) and linting for
# the workflows themselves. The Lua tool suites run in lua-tests.yml.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shell:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh
      - name: bats
        run: bats test/*.bats

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      # pr-fix.lock.yml is generated by gh-aw and uses features newer than
      # actionlint's schema, and the generated file is not hand-edited; lint
      # only the hand-written workflows. Shellcheck integration is disabled so
      # this job has no shellcheck dependency.
      - name: actionlint
        run: |
          files=$(git ls-files '.github/workflows/*.yml' | grep -v 'pr-fix.lock.yml')
          ./actionlint -color -shellcheck= $files
      - name: zizmor
        run: |
          files=$(git ls-files '.github/workflows/*.yml' | grep -v 'pr-fix.lock.yml')
          pipx run zizmor --no-progress $files
