name: Tests

# Tests for the CI scripts under scripts/ (Ruby minitest) and linting for the
# workflows themselves. The Lua tool suites run in lua-tests.yml.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the minitest suite
        run: rake test

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          asset="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o actionlint_checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep -F " $asset" actionlint_checksums.txt | sha256sum -c -
          tar -xzf "$asset" actionlint
      # pr-fix.lock.yml is generated by gh-aw and uses features newer than
      # actionlint's schema, and the generated file is not hand-edited; lint
      # only the hand-written workflows. Shellcheck integration is disabled so
      # this job has no shellcheck dependency.
      - name: actionlint
        run: |
          files=$(git ls-files '.github/workflows/*.yml' | grep -v 'pr-fix.lock.yml')
          ./actionlint -color -shellcheck= $files
      - name: zizmor
        run: |
          files=$(git ls-files '.github/workflows/*.yml' | grep -v 'pr-fix.lock.yml')
          pipx run zizmor --no-progress $files
