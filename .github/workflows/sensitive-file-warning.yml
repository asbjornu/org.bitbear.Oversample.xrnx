name: Sensitive file warning

# Flags pull requests that modify files which deserve extra scrutiny.
# The PR Fixer is allowed to edit any path (see pr-fix.md), so this workflow is
# the guardrail that surfaces sensitive edits for a human instead of blocking
# the fixer. It maintains a single sticky comment per PR and removes it once the
# PR no longer touches anything sensitive.
#
# Logic lives in scripts/sensitive_file_warning.rb (unit-tested with minitest).

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sensitive-file-warning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  warn:
    # Same-repo PRs only, so repository secrets are never used on fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The warning runs with GH_AW_PUSH_TOKEN, so the code must not come from
      # the pull request: any same-repository PR can edit scripts/ and run
      # arbitrary code with the PAT. Prefer the base branch's copy. It is
      # absent until these scripts are merged, so fall back to the PR copy for
      # that bootstrap only.
      - name: Check out the trusted CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .trusted
          persist-credentials: false

      - name: Warn when a PR touches sensitive files
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          script=scripts/sensitive_file_warning.rb
          if [ -f ".trusted/$script" ]; then
            script=".trusted/$script"
          else
            echo "Trusted CI scripts are not on the base branch yet; using the pull request copy" >&2
          fi
          ruby "$script"
