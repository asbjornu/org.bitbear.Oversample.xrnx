name: Sensitive file warning

# Flags pull requests that modify files which deserve extra scrutiny.
# The PR Fixer is allowed to edit any path (see pr-fix.md), so this workflow is
# the guardrail that surfaces sensitive edits for a human instead of blocking
# the fixer. It maintains a single sticky comment per PR and removes it once the
# PR no longer touches anything sensitive.
#
# Logic lives in scripts/sensitive-file-warning.sh (tested with Bats).

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sensitive-file-warning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  warn:
    # Same-repo PRs only, so repository secrets are never used on fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Run the script from the trusted base commit, never the PR worktree:
      # it executes with the maintainer PAT, so a same-repo contributor must
      # not be able to change the code that receives the token.
      - name: Check out the trusted base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Warn when a PR touches sensitive files
        # The script ships with this change and is absent from the base commit
        # until it lands; skip during that rollout window so the job does not
        # fail with "No such file or directory".
        if: ${{ hashFiles('scripts/sensitive-file-warning.sh') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/sensitive-file-warning.sh
