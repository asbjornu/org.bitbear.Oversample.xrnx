name: PR Fixer Auto-Approve

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run parked PR Fixer runs
        env:
          GH_TOKEN: ${{ secrets.GH_AW_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          wf=$(gh api "repos/$REPO/actions/workflows" \
            --jq '.workflows[] | select(.path == ".github/workflows/pr-fix.lock.yml") | .id')
          if [ -z "$wf" ]; then
            echo "pr-fix workflow not found; nothing to do"
            exit 0
          fi
          ids=$(gh api --paginate "repos/$REPO/actions/workflows/$wf/runs?status=action_required&per_page=100" \
            --jq '.workflow_runs[] | select(.head_branch != null) | "\(.created_at)\t\(.head_branch)\t\(.id)"' \
            | sort | awk -F'\t' '{latest[$2] = $3} END {for (b in latest) print latest[b]}')
          if [ -z "$ids" ]; then
            echo "No parked PR Fixer runs"
            exit 0
          fi
          for id in $ids; do
            echo "Re-running parked run $id"
            gh api -X POST "repos/$REPO/actions/runs/$id/rerun" >/dev/null \
              || echo "Re-run failed for $id"
          done
