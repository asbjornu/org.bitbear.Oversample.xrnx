name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Lua 5.1 and luarocks
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.1 liblua5.1-dev luajit luarocks
    - name: Install dev dependencies from rockspec
      run: |
        eval $(luarocks --lua-version=5.1 path)
        sudo luarocks install --lua-version=5.1 --deps-only ./oversample-1.0.0-1.rockspec
    - name: Run unit tests with coverage
      run: |
        eval $(luarocks --lua-version=5.1 path)
        lua5.1 -lluacov test/oversample_core_test.lua
        luacov -r lcov
    - name: Run UI regression and LuaJIT compatibility tests
      run: |
        eval $(luarocks --lua-version=5.1 path)
        lua5.1 test/oversample_ui_test.lua
        luajit test/oversample_core_test.lua
        luajit test/oversample_ui_test.lua
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: luacov.report.out
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
